name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    # No database service and no settings here: pytest starts its own
    # temporary PostgreSQL + pgvector container and forces safe settings,
    # exactly as on a developer machine ([113]). The runner's Docker is used.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: MyPy
        run: uv run mypy .
      - name: PyTest
        # Migrations run inside the suite, on an empty database ([113]).
        # The slowest tests are printed so a speed regression is visible ([66]).
        run: uv run pytest --durations=10

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
        