name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image:
        env:
          POSTGRES_USER: physics
          POSTGRES_PASSWORD: physics
          POSTGRES_DB: physics_ai_tutor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U physics"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    default:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://physics:physics@localhost:5433/physics_ai_tutor_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Rudd
        run: uv run ruff check .
      - name: MyPy
        run: uv run mypy .
      - name: PyTest
        run: uv run pytest
  
  frontend:
    runs-on: ubuntu-latest

    default:
      run: working-directory: frontend

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: "25"
        
        - name: Install dependencies
          run: npm ci
        - name: ESLint
          run: npm run lint
        - name: TypeScript
          run: npx tsc --noEmit
        - name: Build
          run: npm run build
        